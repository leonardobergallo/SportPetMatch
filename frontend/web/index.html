<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>%WEB_TITLE%</title>
  <meta name="description" content="Indio: app gratis para conectar personas y mascotas en actividades pet-friendly." />
  <meta name="indio-api-base" content="/api" />
  <meta name="theme-color" content="#6200ea" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Indio" />
  <link rel="apple-touch-icon" href="/icon-192x192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-192x192.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/icon-152x152.png" />
  <link rel="apple-touch-icon" sizes="144x144" href="/icon-144x144.png" />
  <link rel="apple-touch-icon" sizes="120x120" href="/icon-128x128.png" />
  <link rel="apple-touch-icon" sizes="76x76" href="/icon-96x96.png" />
  <link rel="icon" type="image/png" href="/icon-192x192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
    integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
    crossorigin=""
  />
  <style id="expo-reset">
    html,
    body {
      height: 100%;
      margin: 0;
    }
    body {
      overflow-x: hidden;
      overflow-y: auto;
    }
    #expo-landing-wrap {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #1a1a1a;
    }
    #expo-landing-status {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #888;
      font: 14px/1.4 system-ui, sans-serif;
      pointer-events: none;
      z-index: 11;
    }
    #expo-landing-wrap iframe.loaded ~ #expo-landing-status,
    body.expo-show-app #expo-landing-status {
      display: none;
    }
    #expo-landing-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    #root {
      display: none;
      flex: 1;
      height: 100%;
      width: 100%;
    }
    body.expo-show-app #expo-landing-wrap {
      display: none;
    }
    body.expo-show-app {
      overflow-x: hidden;
      overflow-y: auto;
    }
    body.expo-show-app #root {
      display: flex;
    }
    .leaflet-container {
      height: 100%;
      width: 100%;
    }
    .leaflet-popup-content {
      font-family: inherit;
    }
  </style>
</head>
<body>
  <noscript>Necesitás JavaScript para usar la app.</noscript>
  <div id="expo-landing-wrap">
    <iframe
      src="/multiverse/index.html"
      title="Indio — landing"
      onload="this.classList.add('loaded')"
    ></iframe>
    <p id="expo-landing-status">Cargando landing… Si ves solo gris, ejecutá: npm run sync-public</p>
  </div>
  <div id="root"></div>
  <script
    src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"
    integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA=="
    crossorigin=""
  ></script>
  <script>
    (function () {
      // Por defecto: portada Multiverse (mosaico). App solo con ?app=1 o #app
      if (/\bapp=1\b/.test(location.search) || location.hash === '#app') {
        document.body.classList.add('expo-show-app');
      }
    })();
  </script>
</body>
</html>
