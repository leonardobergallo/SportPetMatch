<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel de control | Indio</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#18211b;background:#f5f7f5;--green:#268536;--orange:#ff7900;--muted:#67726a;--line:#dfe6e0}
    *{box-sizing:border-box}body{margin:0}.top{background:#237b31;color:#fff;padding:18px 5vw;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:800}.brand small{display:block;font-size:12px;font-weight:500;opacity:.86}.wrap{width:min(1180px,92vw);margin:28px auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 18px #15351b0d}.card{padding:18px}.card b{display:block;font-size:28px;color:var(--green)}.card span{color:var(--muted);font-size:13px}.panel{padding:20px}.tools{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:16px}h1{font-size:24px;margin:0}input,button{font:inherit;border-radius:10px;padding:10px 13px}input{border:1px solid #bfc9c1;min-width:280px}button{border:0;background:var(--green);color:#fff;font-weight:700;cursor:pointer}.secondary{background:#edf5ee;color:#216c2e}.danger{background:#b3261e}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0ed;font-size:14px}th{color:#536059;font-size:12px;text-transform:uppercase}.badge{display:inline-block;border-radius:999px;padding:4px 8px;background:#eaf5eb;color:#1d6f2a;font-size:12px}.badge.off{background:#f3f3f3;color:#747474}.pager{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:16px;color:var(--muted)}.empty,.error{padding:24px;text-align:center;color:var(--muted)}.error{color:#a11}.login{width:min(420px,92vw);margin:12vh auto;padding:26px}.login input{width:100%;margin:16px 0}.hidden{display:none!important}@media(max-width:650px){.wrap{width:94vw}.top{padding:15px 3vw}.panel{padding:14px}input{min-width:100%}}
    #membresias{margin-top:24px}.membership-list{display:grid;gap:12px}.membership-entry{padding:14px;border:1px solid var(--line);border-radius:12px}.membership-entry p{margin:.35rem 0}.membership-entry form{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.membership-entry input:not([type=checkbox]){min-width:0;flex:1 1 14rem}.membership-entry input[type=checkbox]{min-width:0}.membership-entry label{flex-basis:100%}
    .admin-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.admin-nav a{background:#edf5ee;color:#216c2e;text-decoration:none;font-weight:700;font-size:14px;padding:9px 14px;border-radius:999px}.admin-nav a:hover{background:#dcefdf}.panel+.panel{margin-top:24px}.panel h2{font-size:20px;margin:24px 0 12px}.panel select{font:inherit;border:1px solid #bfc9c1;border-radius:10px;padding:10px 13px;background:#fff}.badge.pending{background:#fff3df;color:#8a5300}.badge.rejected{background:#fde9e7;color:#9b241b}.badge.approved{background:#eaf5eb;color:#1d6f2a}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:7px 10px;font-size:13px}.muted{color:var(--muted);font-size:13px}.stat-inline{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:10px}
  </style>
</head>
<body>
  <header class="top"><div class="brand">🐾 Indio <small>Panel de control web</small></div><button id="logout" class="danger hidden">Salir</button></header>
  <main>
    <section id="login" class="panel login">
      <h1>Acceso administrativo</h1>
      <p>Ingresá con el correo y la contraseña de tu cuenta de Indio.</p>
      <form id="loginForm" method="post">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" autocomplete="username" required />
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button id="loginButton" type="submit">Ingresar</button>
      </form>
      <div id="loginError" class="error hidden" role="alert"></div>
    </section>
    <section id="dashboard" class="wrap hidden">
      <div id="cards" class="cards"></div>
      <nav class="admin-nav" aria-label="Secciones del panel">
        <a href="#usuarios">Usuarios</a>
        <a href="#eventos">Eventos</a>
        <a href="#lugares">Lugares</a>
        <a href="#paseadores">Paseadores</a>
        <a href="#paseos">Paseos</a>
        <a href="#membresias">Membresías</a>
      </nav>
      <div class="panel" id="usuarios">
        <div class="tools"><h1>Personas registradas</h1><form id="searchForm"><input id="search" type="search" placeholder="Buscar nombre, email, teléfono o ciudad" /><select id="userEstado"><option value="todos">Todos</option><option value="activos">Activos</option><option value="inactivos">Inactivos</option></select><button>Buscar</button></form></div>
        <p id="usuariosMensaje" role="status"></p>
        <div id="content" class="table-wrap"></div>
        <div class="pager"><button id="prev" class="secondary">Anterior</button><span id="pageInfo"></span><button id="next" class="secondary">Siguiente</button></div>
      </div>

      <section class="panel" id="eventos">
        <div class="tools">
          <h1>Eventos</h1>
          <form id="eventoFiltros">
            <input id="eventoBuscar" type="search" placeholder="Buscar título u organizador" />
            <select id="eventoEstado">
              <option value="todos">Todos</option>
              <option value="activos">Activos</option>
              <option value="inactivos">Inactivos</option>
            </select>
            <button class="secondary">Filtrar</button>
          </form>
        </div>
        <div id="listaEventos" class="table-wrap"></div>
        <div class="pager"><button id="eventoAnterior" class="secondary" disabled>Anterior</button><span id="eventoPagina"></span><button id="eventoSiguiente" class="secondary" disabled>Siguiente</button></div>
      </section>

      <section class="panel" id="lugares">
        <div class="tools">
          <h1>Lugares pet friendly</h1>
          <form id="lugarFiltros">
            <input id="lugarBuscar" type="search" placeholder="Buscar nombre, ciudad o dirección" />
            <select id="lugarEstado">
              <option value="todos">Todos</option>
              <option value="activos">Activos</option>
              <option value="inactivos">Inactivos</option>
            </select>
            <button class="secondary">Filtrar</button>
          </form>
        </div>
        <div id="resumenLugares" class="stat-inline"></div>
        <div id="listaLugares" class="table-wrap"></div>
        <div class="pager"><button id="lugarAnterior" class="secondary" disabled>Anterior</button><span id="lugarPagina"></span><button id="lugarSiguiente" class="secondary" disabled>Siguiente</button></div>
      </section>

      <section class="panel" id="paseadores">
        <div class="tools">
          <h1>Paseadores</h1>
          <form id="paseadorFiltros">
            <input id="paseadorBuscar" type="search" placeholder="Buscar nombre, email, ciudad o zona" />
            <select id="paseadorEstado">
              <option value="pendiente">Pendientes</option>
              <option value="aprobado">Aprobados</option>
              <option value="rechazado">Rechazados</option>
            </select>
            <button class="secondary">Filtrar</button>
          </form>
        </div>
        <div id="resumenPaseadores" class="stat-inline"></div>
        <p id="paseadorMensaje" role="status"></p>
        <div id="listaPaseadores" class="membership-list"></div>
        <div class="pager"><button id="paseadorAnterior" class="secondary" disabled>Anterior</button><span id="paseadorPagina"></span><button id="paseadorSiguiente" class="secondary" disabled>Siguiente</button></div>
      </section>

      <section class="panel" id="paseos">
        <div class="tools">
          <h1>Paseos</h1>
          <form id="paseoFiltros">
            <input id="paseoBuscar" type="search" placeholder="Buscar dueño, paseador o mascota" />
            <select id="paseoEstado">
              <option value="todos">Todos</option>
              <option value="pendiente">Pendientes</option>
              <option value="aceptado">Aceptados</option>
              <option value="en_curso">En curso</option>
              <option value="finalizado">Finalizados</option>
              <option value="rechazado">Rechazados</option>
              <option value="cancelado">Cancelados</option>
            </select>
            <button class="secondary">Filtrar</button>
          </form>
        </div>
        <div id="resumenPaseos" class="stat-inline"></div>
        <p id="paseoMensaje" role="status"></p>
        <div id="listaPaseos" class="table-wrap"></div>
        <div class="pager"><button id="paseoAnterior" class="secondary" disabled>Anterior</button><span id="paseoPagina"></span><button id="paseoSiguiente" class="secondary" disabled>Siguiente</button></div>
      </section>
      <section class="panel" id="membresias">
        <div class="tools">
          <h1>Membresías</h1>
          <label>Renovaciones
            <select id="estadoRenovacion">
              <option value="pendiente">Pendientes</option>
              <option value="completada">Confirmadas</option>
            </select>
          </label>
          <button id="actualizarMembresias" class="secondary">Actualizar</button>
        </div>
        <p id="membresiaMensaje" role="status"></p>
        <div id="listaRenovaciones" class="membership-list"></div>
        <div class="pager">
          <button id="membresiaAnterior" class="secondary" disabled>Anterior</button>
          <span id="membresiaPagina"></span>
          <button id="membresiaSiguiente" class="secondary" disabled>Siguiente</button>
        </div>
        <h2>Pruebas recientes</h2>
        <ul id="listaPruebas"></ul>
      </section>
    </section>
  </main>
  <script>
    (() => {
      const tokenKey = 'indio_admin_token';
      const state = {token: sessionStorage.getItem(tokenKey), page: 1, pages: 1, search: '', estado: 'todos'};
      const $=id=>document.getElementById(id);
      const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      const date=v=>v?new Intl.DateTimeFormat('es-AR',{dateStyle:'short',timeStyle:'short'}).format(new Date(v)):'—';
      async function api(path, token, options = {}) {
        const response = await fetch('/api/admin' + path, {
          ...options,
          headers: {Authorization: 'Bearer ' + token, 'Content-Type': 'application/json'},
        });
        if (!response.ok) {
          const messages = {
            401: 'Tu sesión venció. Volvé a ingresar.',
            403: 'Tu cuenta no tiene acceso administrativo.',
          };
          const body = await response.json().catch(() => ({}));
          const error = new Error(messages[response.status] || body.error || 'No se pudo cargar la información.');
          error.status = response.status;
          throw error;
        }
        return response.json();
      }
      function showLoginError(message) {
        $('loginError').textContent = message;
        $('loginError').classList.remove('hidden');
      }
      function clearSession() {
        sessionStorage.removeItem(tokenKey);
        state.token = null;
        $('cards').replaceChildren();
        $('content').replaceChildren();
        $('usuariosMensaje').textContent = '';
        $('paseadorMensaje').textContent = '';
        $('listaEventos').replaceChildren();
        $('listaLugares').replaceChildren();
        $('listaPaseadores').replaceChildren();
        $('listaPaseos').replaceChildren();
        $('resumenLugares').replaceChildren();
        $('resumenPaseadores').replaceChildren();
        $('resumenPaseos').replaceChildren();
        $('paseoMensaje').textContent = '';
        $('listaRenovaciones').replaceChildren();
        $('listaPruebas').replaceChildren();
        $('dashboard').classList.add('hidden');
        $('logout').classList.add('hidden');
        $('login').classList.remove('hidden');
      }
      function showDashboard(){ $('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden') }
      let paginaMembresia = 1;
      let cargaMembresia = 0;
      async function cargarMembresias() {
        const token = state.token;
        const carga = ++cargaMembresia;
        const estado = $('estadoRenovacion').value;
        const datos = await api(`/membresias?estado=${estado}&pagina=${paginaMembresia}`, token);
        if (token !== state.token || carga !== cargaMembresia) return;
        $('listaRenovaciones').innerHTML = datos.renovaciones.map(pago => {
          const detalle = `<p><strong>${esc(pago.usuario.nombre)}</strong> · ${esc(pago.usuario.email)}</p>
            <p>${esc(pago.moneda)} $${esc(new Intl.NumberFormat('es-AR').format(pago.monto))}</p>`;
          if (pago.estado === 'completada') {
            return `<article class="membership-entry">${detalle}<p>Confirmada · Operación ${esc(pago.operacionIndio)}</p></article>`;
          }
          const enlace = pago.enlacePagoIndio;
          const boton = pago.enlaceEnviadoEn ? 'Correo enviado' : enlace ? 'Reintentar envío' : 'Guardar y enviar enlace';
          return `<article class="membership-entry">${detalle}
            <form data-id="${esc(pago.id)}" data-accion="enlace">
              <input name="enlace" aria-label="Enlace de Mercado Pago" type="url" placeholder="Enlace de Mercado Pago" value="${esc(enlace)}" ${enlace ? 'readonly' : ''} required>
              <button ${pago.enlaceEnviadoEn ? 'disabled' : ''}>${boton}</button>
            </form>
            ${enlace ? `<form data-id="${esc(pago.id)}" data-accion="confirmar">
              <label><input type="checkbox" required> Verifiqué en Mercado Pago que el importe es correcto y el pago está aprobado.</label>
              <input name="operacion" aria-label="Número de operación" inputmode="numeric" placeholder="Número de operación" required>
              <button>Confirmar pago</button>
            </form>` : ''}
          </article>`;
        }).join('') || '<p>No hay renovaciones con este estado.</p>';
        $('listaPruebas').innerHTML = datos.pruebas.map(prueba =>
          `<li>${esc(prueba.usuario.email)} · Hasta ${esc(date(prueba.fechaFin))}${prueba.avisoPruebaEn ? '' : ' · Aviso por correo pendiente'}</li>`
        ).join('');
        $('membresiaPagina').textContent = `Página ${datos.pagina} de ${datos.paginas}`;
        $('membresiaAnterior').disabled = datos.pagina <= 1;
        $('membresiaSiguiente').disabled = datos.pagina >= datos.paginas;
      }
      function errorMembresia(error) {
        $('membresiaMensaje').textContent = error.message;
      }
      $('actualizarMembresias').onclick = () => cargarMembresias().catch(errorMembresia);
      $('estadoRenovacion').onchange = () => {
        paginaMembresia = 1;
        cargarMembresias().catch(errorMembresia);
      };
      $('membresiaAnterior').onclick = () => {
        paginaMembresia--;
        cargarMembresias().catch(errorMembresia);
      };
      $('membresiaSiguiente').onclick = () => {
        paginaMembresia++;
        cargarMembresias().catch(errorMembresia);
      };
      $('listaRenovaciones').addEventListener('submit', async event => {
        event.preventDefault();
        const form = event.target;
        const {id, accion} = form.dataset;
        const boton = event.submitter || form.querySelector('button');
        if (boton) boton.disabled = true;
        try {
          const datos = Object.fromEntries(new FormData(form));
          const respuesta = await api(`/membresias/${encodeURIComponent(id)}/${accion}`, state.token, {
            method: 'POST', body: JSON.stringify(datos),
          });
          $('membresiaMensaje').textContent = accion === 'confirmar'
            ? 'Pago confirmado y membresía renovada.'
            : respuesta.correoEnviado ? 'Enlace guardado y enviado.'
              : 'Enlace guardado. El correo quedó pendiente y se puede reintentar.';
          await cargarMembresias();
        } catch (error) {
          errorMembresia(error);
        } finally {
          if (boton) boton.disabled = false;
        }
      });
      let paginaPaseo = 1, paginasPaseo = 1;
      async function cargarPaseos() {
        const q = new URLSearchParams({
          pagina: paginaPaseo,
          estado: $('paseoEstado').value,
          buscar: $('paseoBuscar').value.trim(),
        });
        const datos = await api('/paseos?' + q, state.token);
        $('resumenPaseos').textContent = `${datos.resumen.activos} activos · ${datos.resumen.pendientes} pendientes · ${datos.resumen.finalizados} finalizados`;
        $('listaPaseos').innerHTML = datos.paseos.length
          ? `<table><thead><tr><th>Programado</th><th>Dueño</th><th>Paseador</th><th>Mascota</th><th>Estado</th><th>Recorrido</th><th>Acción</th></tr></thead><tbody>${datos.paseos.map(p => {
              const estadoClase = p.estado === 'finalizado' || p.estado === 'aceptado' ? 'approved' : p.estado === 'rechazado' ? 'rejected' : p.estado === 'pendiente' || p.estado === 'en_curso' ? 'pending' : 'off';
              const activo = ['pendiente', 'aceptado', 'en_curso'].includes(p.estado);
              return `<tr>
                <td>${date(p.fechaProgramada)}</td>
                <td>${esc(p.dueno?.nombre || '—')}<br><small>${esc(p.dueno?.email || '')}</small></td>
                <td>${esc(p.paseador?.usuario?.nombre || '—')}<br><small>${esc(p.paseador?.usuario?.email || '')}</small></td>
                <td>${esc(p.mascota?.nombre || '—')}</td>
                <td><span class="badge ${estadoClase}">${esc(p.estado)}</span></td>
                <td>${p._count?.puntos || 0} puntos${p.distanciaKm != null ? '<br><small>' + esc(Number(p.distanciaKm).toFixed(2)) + ' km</small>' : ''}</td>
                <td>${activo ? `<div class="actions"><button class="danger" data-paseo-id="${esc(p.id)}">Cancelar</button></div>` : '—'}</td>
              </tr>`;
            }).join('')}</tbody></table>`
          : '<div class="empty">No hay paseos con ese filtro.</div>';
        $('paseoPagina').textContent = `Página ${datos.pagina} de ${datos.paginas} · ${datos.total} paseos`;
        $('paseoAnterior').disabled = datos.pagina <= 1;
        $('paseoSiguiente').disabled = datos.pagina >= datos.paginas;
        paginasPaseo = datos.paginas;
      }

      function cards(r){const items=[['Usuarios',r.totalUsuarios],['Altas últimos 7 días',r.usuariosUltimosSieteDias],['Usuarios activos',r.usuariosActivos],['Mascotas',r.totalMascotas],['Eventos',r.totalEventos],['Lugares',r.totalLugares],['Paseadores pendientes',r.paseadoresPendientes],['Paseos activos',r.paseosActivos],['Matches',r.totalMatches],['Mensajes',r.totalMensajes]];$('cards').innerHTML=items.map(([l,v])=>`<div class="card"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('')}

      let paginaEvento = 1, paginasEvento = 1;
      async function cargarEventos() {
        const q = new URLSearchParams({
          pagina: paginaEvento,
          estado: $('eventoEstado').value,
          buscar: $('eventoBuscar').value.trim(),
        });
        const datos = await api('/eventos?' + q, state.token);
        $('listaEventos').innerHTML = datos.eventos.length
          ? `<table><thead><tr><th>Fecha</th><th>Evento</th><th>Organizador</th><th>Participantes</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${datos.eventos.map(e => `<tr>
              <td>${date(e.fechaInicio)}</td>
              <td><strong>${esc(e.titulo)}</strong><br><small>${esc(e.tipo || '')}${e.esPetFriendly ? ' · Pet friendly' : ''}</small></td>
              <td>${esc(e.organizador?.nombre || '—')}<br><small>${esc(e.organizador?.email || '')}</small></td>
              <td>${esc(e._count?.participantes ?? 0)}</td>
              <td><span class="badge ${e.isActive ? '' : 'off'}">${e.isActive ? 'Activo' : 'Inactivo'}</span></td>
              <td><div class="actions"><button class="${e.isActive ? 'danger' : 'secondary'}" data-evento-id="${esc(e.id)}" data-activo="${e.isActive ? '1' : '0'}">${e.isActive ? 'Desactivar' : 'Activar'}</button></div></td>
            </tr>`).join('')}</tbody></table>`
          : '<div class="empty">No hay eventos con ese filtro.</div>';
        $('eventoPagina').textContent = `Página ${datos.pagina} de ${datos.paginas} · ${datos.total} eventos`;
        $('eventoAnterior').disabled = datos.pagina <= 1;
        $('eventoSiguiente').disabled = datos.pagina >= datos.paginas;
        paginasEvento = datos.paginas;
      }

      let paginaLugar = 1, paginasLugar = 1;
      async function cargarLugares() {
        const q = new URLSearchParams({
          pagina: paginaLugar,
          estado: $('lugarEstado').value,
          buscar: $('lugarBuscar').value.trim(),
        });
        const datos = await api('/lugares?' + q, state.token);
        $('resumenLugares').textContent = `${datos.resumen.verificados} verificados · ${datos.resumen.pendientes} pendientes de verificar`;
        $('listaLugares').innerHTML = datos.lugares.length
          ? `<table><thead><tr><th>Lugar</th><th>Categoría</th><th>Ciudad</th><th>Verificado</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${datos.lugares.map(l => `<tr>
              <td><strong>${esc(l.nombre)}</strong><br><small>${esc(l.direccion || '')}</small></td>
              <td>${esc(l.categoria)}</td>
              <td>${esc(l.ciudad)}<br><small>${esc(l.provincia)}</small></td>
              <td><span class="badge ${l.verificado ? '' : 'pending'}">${l.verificado ? 'Verificado' : 'Pendiente'}</span></td>
              <td><span class="badge ${l.isActive ? '' : 'off'}">${l.isActive ? 'Activo' : 'Inactivo'}</span></td>
              <td><div class="actions">
                <button class="secondary" data-lugar-id="${esc(l.id)}" data-campo="verificado" data-valor="${l.verificado ? '0' : '1'}">${l.verificado ? 'Quitar verificación' : 'Verificar'}</button>
                <button class="${l.isActive ? 'danger' : 'secondary'}" data-lugar-id="${esc(l.id)}" data-campo="isActive" data-valor="${l.isActive ? '0' : '1'}">${l.isActive ? 'Desactivar' : 'Activar'}</button>
              </div></td>
            </tr>`).join('')}</tbody></table>`
          : '<div class="empty">No hay lugares con ese filtro.</div>';
        $('lugarPagina').textContent = `Página ${datos.pagina} de ${datos.paginas} · ${datos.total} lugares`;
        $('lugarAnterior').disabled = datos.pagina <= 1;
        $('lugarSiguiente').disabled = datos.pagina >= datos.paginas;
        paginasLugar = datos.paginas;
      }

      let paginaPaseador = 1, paginasPaseador = 1;
      async function cargarPaseadores() {
        const q = new URLSearchParams({
          pagina: paginaPaseador,
          estado: $('paseadorEstado').value,
          buscar: $('paseadorBuscar').value.trim(),
        });
        const datos = await api('/paseadores?' + q, state.token);
        $('resumenPaseadores').textContent = `${datos.resumen.pendientes} pendientes · ${datos.resumen.aprobados} aprobados · ${datos.resumen.rechazados} rechazados`;
        $('listaPaseadores').innerHTML = datos.solicitudes.length
          ? datos.solicitudes.map(p => `<article class="membership-entry">
              <p><strong>${esc(p.usuario.nombre)}</strong> · ${esc(p.usuario.email)}</p>
              <p>${esc(p.ciudad)}${p.zona ? ' · ' + esc(p.zona) : ''} · ${esc(p.telefono)}</p>
              <p>${p.precioHora ? '$' + esc(new Intl.NumberFormat('es-AR').format(p.precioHora)) + ' / hora · ' : ''}${esc(p.disponibilidad || 'Disponibilidad a convenir')}</p>
              <p><span class="badge ${p.estado === 'aprobado' ? 'approved' : p.estado === 'rechazado' ? 'rejected' : 'pending'}">${esc(p.estado)}</span> · ${date(p.createdAt)}</p>
              ${p.experiencia ? `<p><small>${esc(p.experiencia)}</small></p>` : ''}
              ${p.motivoRechazo ? `<p><small>Motivo: ${esc(p.motivoRechazo)}</small></p>` : ''}
              <div class="actions">
                ${p.estado !== 'aprobado' ? `<button data-paseador-id="${esc(p.id)}" data-accion="aprobar">Aprobar</button>` : ''}
                ${p.estado !== 'rechazado' ? `<button class="danger" data-paseador-id="${esc(p.id)}" data-accion="rechazar">Rechazar</button>` : ''}
              </div>
            </article>`).join('')
          : '<p>No hay solicitudes con ese filtro.</p>';
        $('paseadorPagina').textContent = `Página ${datos.pagina} de ${datos.paginas} · ${datos.total} solicitudes`;
        $('paseadorAnterior').disabled = datos.pagina <= 1;
        $('paseadorSiguiente').disabled = datos.pagina >= datos.paginas;
        paginasPaseador = datos.paginas;
      }
      function table(users){
        if(!users.length){$('content').innerHTML='<div class="empty">No se encontraron registros.</div>';return}
        $('content').innerHTML=`<table><thead><tr><th>Alta</th><th>Persona</th><th>Contacto</th><th>Ubicación</th><th>Estado</th><th>Actividad</th><th>Acciones</th></tr></thead><tbody>${users.map(u=>`<tr>
          <td>${date(u.createdAt)}</td>
          <td><strong>${esc(u.nombre)}</strong>${u.esAdmin ? ' <span class="badge">Admin</span>' : ''}<br><small>${esc(u.tipoUsuario||'')}</small></td>
          <td>${esc(u.email)}<br><small>${esc(u.telefono||'Sin teléfono')}</small></td>
          <td>${esc([u.ubicacionCiudad,u.ubicacionPais].filter(Boolean).join(', ')||'—')}</td>
          <td><span class="badge ${u.isActive?'':'off'}">${u.isActive?'Activo':'Inactivo'}</span><br><small>${u.emailVerificado?'Email verificado':'Email pendiente'}</small></td>
          <td>${u._count.mascotas} mascotas · ${u._count.eventosCreados} eventos · ${u._count.matches} matches</td>
          <td><div class="actions">
            <button class="${u.isActive ? 'danger' : 'secondary'}" data-user-id="${esc(u.id)}" data-user-active="${u.isActive ? '1' : '0'}" data-user-email="${esc(u.email)}">${u.isActive ? 'Desactivar' : 'Activar'}</button>
            <button class="secondary" data-user-id="${esc(u.id)}" data-user-verified="${u.emailVerificado ? '1' : '0'}" data-user-email="${esc(u.email)}">${u.emailVerificado ? 'Quitar verificación' : 'Verificar email'}</button>
            <button class="secondary" data-user-password-id="${esc(u.id)}" data-user-email="${esc(u.email)}">Restablecer contraseña</button>
          </div></td>
        </tr>`).join('')}</tbody></table>`
      }
      let latestLoad = 0;
      async function load() {
        const request = ++latestLoad;
        const {token, page, search, estado} = state;
        $('content').innerHTML = '<div class="empty">Cargando…</div>';
        try {
          const [stats, users] = await Promise.all([
            api('/stats', token),
            api(`/usuarios?pagina=${page}&limite=25&buscar=${encodeURIComponent(search)}&estado=${encodeURIComponent(estado)}`, token),
          ]);
          if (request !== latestLoad || token !== state.token) return;
          sessionStorage.setItem(tokenKey, token);
          cards(stats.resumen);
          table(users.usuarios);
          state.pages = users.paginacion.paginas;
          $('pageInfo').textContent = `Página ${page} de ${state.pages} · ${users.paginacion.total} registros`;
          $('prev').disabled = page <= 1;
          $('next').disabled = page >= state.pages;
          showDashboard();
          cargarMembresias().catch(errorMembresia);
          cargarEventos().catch(error => { $('listaEventos').innerHTML = `<div class="error">${esc(error.message)}</div>`; });
          cargarLugares().catch(error => { $('listaLugares').innerHTML = `<div class="error">${esc(error.message)}</div>`; });
          cargarPaseadores().catch(error => { $('listaPaseadores').innerHTML = `<div class="error">${esc(error.message)}</div>`; });
          cargarPaseos().catch(error => { $('listaPaseos').innerHTML = `<div class="error">${esc(error.message)}</div>`; });
          if (location.hash) {
            const destino = document.querySelector(location.hash);
            if (destino) destino.scrollIntoView();
          }
        } catch (error) {
          if (request !== latestLoad || token !== state.token) return;
          if (error.status === 401 || error.status === 403 || $('dashboard').classList.contains('hidden')) {
            clearSession();
            showLoginError(error.message);
            return;
          }
          $('content').textContent = 'No se pudo cargar la información. Volvé a intentar.';
        }
      }
      $('loginForm').addEventListener('submit', async event => {
        event.preventDefault();
        const button = $('loginButton');
        if (button.disabled) return;
        button.disabled = true;
        $('loginError').classList.add('hidden');
        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: $('email').value, password: $('password').value}),
          });
          if (response.status === 401) throw new Error('Revisá el correo y la contraseña.');
          if (response.status === 403) throw new Error('Tu cuenta está inactiva.');
          if (response.status === 429) throw new Error('Demasiados intentos. Volvé a intentar más tarde.');
          if (!response.ok) throw new Error('No se pudo iniciar sesión.');
          const {data} = await response.json();
          state.token = data.token;
          await load();
        } catch (error) {
          showLoginError(error.message);
        } finally {
          $('password').value = '';
          button.disabled = false;
        }
      });
      $('searchForm').addEventListener('submit',e=>{e.preventDefault();state.search=$('search').value.trim();state.estado=$('userEstado').value;state.page=1;load()});
      $('userEstado').onchange=()=>{state.estado=$('userEstado').value;state.page=1;load()};
      $('prev').onclick=()=>{if(state.page>1){state.page--;load()}};$('next').onclick=()=>{if(state.page<state.pages){state.page++;load()}};

      $('content').addEventListener('click', async event => {
        const estadoBoton = event.target.closest('[data-user-active]');
        const verificarBoton = event.target.closest('[data-user-verified]');
        const passwordBoton = event.target.closest('[data-user-password-id]');
        if (!estadoBoton && !verificarBoton && !passwordBoton) return;
        const boton = estadoBoton || verificarBoton || passwordBoton;
        boton.disabled = true;
        try {
          if (estadoBoton) {
            const activo = estadoBoton.dataset.userActive === '1';
            await api(`/usuarios/${encodeURIComponent(estadoBoton.dataset.userId)}/estado`, state.token, {
              method: 'POST', body: JSON.stringify({ isActive: !activo }),
            });
            $('usuariosMensaje').textContent = `Cuenta ${!activo ? 'activada' : 'desactivada'}: ${estadoBoton.dataset.userEmail}`;
            await load();
          } else if (verificarBoton) {
            const verificado = verificarBoton.dataset.userVerified === '1';
            await api(`/usuarios/${encodeURIComponent(verificarBoton.dataset.userId)}/verificar`, state.token, {
              method: 'POST', body: JSON.stringify({ emailVerificado: !verificado }),
            });
            $('usuariosMensaje').textContent = `Email ${!verificado ? 'verificado' : 'marcado como pendiente'}: ${verificarBoton.dataset.userEmail}`;
            await load();
          } else if (passwordBoton) {
            if (!confirm(`¿Generar una contraseña temporal para ${passwordBoton.dataset.userEmail}?`)) return;
            const datos = await api(`/usuarios/${encodeURIComponent(passwordBoton.dataset.userPasswordId)}/password`, state.token, {
              method: 'POST', body: '{}',
            });
            $('usuariosMensaje').innerHTML = `Contraseña temporal para <strong>${esc(datos.email)}</strong>: <code>${esc(datos.passwordTemporal)}</code> <button class="secondary" id="copiarPassword">Copiar</button> — mostrala una sola vez.`;
            $('copiarPassword').onclick = async () => {
              try {
                await navigator.clipboard.writeText(datos.passwordTemporal);
                $('copiarPassword').textContent = 'Copiada';
              } catch {
                $('copiarPassword').textContent = 'Seleccioná y copiá manualmente';
              }
            };
          }
        } catch (error) {
          $('usuariosMensaje').textContent = error.message;
        } finally {
          boton.disabled = false;
        }
      });

      function errorEn(id, error) { $(id).innerHTML = `<div class="error">${esc(error.message)}</div>`; }

      $('eventoFiltros').addEventListener('submit', e => { e.preventDefault(); paginaEvento = 1; cargarEventos().catch(error => errorEn('listaEventos', error)); });
      $('eventoEstado').onchange = () => { paginaEvento = 1; cargarEventos().catch(error => errorEn('listaEventos', error)); };
      $('eventoAnterior').onclick = () => { if (paginaEvento > 1) { paginaEvento--; cargarEventos().catch(error => errorEn('listaEventos', error)); } };
      $('eventoSiguiente').onclick = () => { if (paginaEvento < paginasEvento) { paginaEvento++; cargarEventos().catch(error => errorEn('listaEventos', error)); } };
      $('listaEventos').addEventListener('click', async event => {
        const boton = event.target.closest('[data-evento-id]');
        if (!boton) return;
        boton.disabled = true;
        try {
          const activo = boton.dataset.activo === '1';
          await api(`/eventos/${encodeURIComponent(boton.dataset.eventoId)}/estado`, state.token, {
            method: 'POST', body: JSON.stringify({ isActive: !activo }),
          });
          await cargarEventos();
        } catch (error) { errorEn('listaEventos', error); }
      });

      $('lugarFiltros').addEventListener('submit', e => { e.preventDefault(); paginaLugar = 1; cargarLugares().catch(error => errorEn('listaLugares', error)); });
      $('lugarEstado').onchange = () => { paginaLugar = 1; cargarLugares().catch(error => errorEn('listaLugares', error)); };
      $('lugarAnterior').onclick = () => { if (paginaLugar > 1) { paginaLugar--; cargarLugares().catch(error => errorEn('listaLugares', error)); } };
      $('lugarSiguiente').onclick = () => { if (paginaLugar < paginasLugar) { paginaLugar++; cargarLugares().catch(error => errorEn('listaLugares', error)); } };
      $('listaLugares').addEventListener('click', async event => {
        const boton = event.target.closest('[data-lugar-id]');
        if (!boton) return;
        boton.disabled = true;
        try {
          await api(`/lugares/${encodeURIComponent(boton.dataset.lugarId)}`, state.token, {
            method: 'POST', body: JSON.stringify({ [boton.dataset.campo]: boton.dataset.valor === '1' }),
          });
          await cargarLugares();
        } catch (error) { errorEn('listaLugares', error); }
      });

      $('paseadorFiltros').addEventListener('submit', e => { e.preventDefault(); paginaPaseador = 1; cargarPaseadores().catch(error => errorEn('listaPaseadores', error)); });
      $('paseadorEstado').onchange = () => { paginaPaseador = 1; cargarPaseadores().catch(error => errorEn('listaPaseadores', error)); };
      $('paseadorAnterior').onclick = () => { if (paginaPaseador > 1) { paginaPaseador--; cargarPaseadores().catch(error => errorEn('listaPaseadores', error)); } };
      $('paseadorSiguiente').onclick = () => { if (paginaPaseador < paginasPaseador) { paginaPaseador++; cargarPaseadores().catch(error => errorEn('listaPaseadores', error)); } };
      $('listaPaseadores').addEventListener('click', async event => {
        const boton = event.target.closest('[data-paseador-id]');
        if (!boton) return;
        boton.disabled = true;
        try {
          const accion = boton.dataset.accion;
          const motivo = accion === 'rechazar' ? (prompt('Motivo del rechazo (opcional):') || '') : '';
          await api(`/paseadores/${encodeURIComponent(boton.dataset.paseadorId)}/${accion}`, state.token, {
            method: 'POST', body: JSON.stringify({ motivo }),
          });
          $('paseadorMensaje').textContent = accion === 'aprobar' ? 'Paseador aprobado.' : 'Solicitud rechazada.';
          await cargarPaseadores();
        } catch (error) { errorEn('listaPaseadores', error); }
      });

      $('paseoFiltros').addEventListener('submit', e => { e.preventDefault(); paginaPaseo = 1; cargarPaseos().catch(error => errorEn('listaPaseos', error)); });
      $('paseoEstado').onchange = () => { paginaPaseo = 1; cargarPaseos().catch(error => errorEn('listaPaseos', error)); };
      $('paseoAnterior').onclick = () => { if (paginaPaseo > 1) { paginaPaseo--; cargarPaseos().catch(error => errorEn('listaPaseos', error)); } };
      $('paseoSiguiente').onclick = () => { if (paginaPaseo < paginasPaseo) { paginaPaseo++; cargarPaseos().catch(error => errorEn('listaPaseos', error)); } };
      $('listaPaseos').addEventListener('click', async event => {
        const boton = event.target.closest('[data-paseo-id]');
        if (!boton) return;
        if (!confirm('¿Cancelar este paseo?')) return;
        boton.disabled = true;
        try {
          await api(`/paseos/${encodeURIComponent(boton.dataset.paseoId)}/cancelar`, state.token, {
            method: 'POST', body: '{}',
          });
          $('paseoMensaje').textContent = 'Paseo cancelado.';
          await cargarPaseos();
        } catch (error) { errorEn('listaPaseos', error); }
      });

      $('logout').onclick=()=>{
        clearSession();
        location.reload();
      };
      if (state.token) load();
    })();
  </script>
</body>
</html>
